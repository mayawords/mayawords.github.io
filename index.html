<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Word Trainer</title>
<meta name="apple-mobile-web-app-title" content="Word Trainer">
<meta name="application-name" content="Word Trainer">
<meta name="theme-color" content="#1F4E8C">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Word Trainer v4.5 (25.10.2026): Irregular verbs, a deck of type "verbs" (list "verbs" in textbook.json) with four modes: Flashcards, Pick the forms, Write the forms, Meaning. v4.4 (18.10.2026): Topics, the teacher's sheets as a third source (Notebook, Focus, Topics). v4.1 (17.10.2026): Add words starts with the photo (no Source step), clearer duplicate/limit/number messages, Undo, no overscroll. v4: runs on GitHub Pages (fetch to Apps Script) and inside /exec (google.script.run). v3: Home with hero, tiles and units, bottom sheet for "how", tab bar, Add words. */
:root{
  --bg:#EDF1F7; --surface:#FFFFFF; --surface-2:#F5F7FB; --ink:#16233B; --muted:#5B6884; --line:#D3DBE8;
  --seg-ink:#4C5975; /* unselected segment text on --line: 5.0:1 (muted gives 4.0:1) */
  --accent:#1F4E8C; --accent-ink:#FFFFFF; --accent-soft:#DCE7F7;
  --hero:#1F4E8C; --hero-2:#163A6B; --hero-ink:#FFFFFF; --hero-muted:rgba(255,255,255,.78); --hero-chip:rgba(255,255,255,.14);
  --marker:#FBD55B; --marker-ink:#16233B; --rule:#DCE6F5; --redrule:#E6A3A0;
  --good:#1D7A4B; --good-bg:#E3F4EA; --bad:#B3372F; --bad-bg:#FBE7E5; --warn:#8A5A00; --warn-bg:#FFF1CC;
  --scrim:rgba(10,18,34,.45); --shadow:0 10px 30px -16px rgba(22,35,59,.45);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --r:12px; --r-lg:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1626; --surface:#18223A; --surface-2:#1D2945; --ink:#E7ECF6; --muted:#9BA7C0; --line:#2B3756; --seg-ink:#9BA7C0;
  --accent:#86ADEB; --accent-ink:#0F1626; --accent-soft:#22345A;
  --hero:#1B3260; --hero-2:#14264A; --hero-ink:#F1F5FC; --hero-muted:rgba(241,245,252,.75); --hero-chip:rgba(255,255,255,.10);
  --marker:#E9BC3A; --marker-ink:#16233B; --rule:#222E4A; --redrule:#6E3B44;
  --good:#58C892; --good-bg:#16352A; --bad:#F2857A; --bad-bg:#3A1F24; --warn:#F0C25A; --warn-bg:#3A3018;
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1626; --surface:#18223A; --surface-2:#1D2945; --ink:#E7ECF6; --muted:#9BA7C0; --line:#2B3756; --seg-ink:#9BA7C0;
  --accent:#86ADEB; --accent-ink:#0F1626; --accent-soft:#22345A;
  --hero:#1B3260; --hero-2:#14264A; --hero-ink:#F1F5FC; --hero-muted:rgba(241,245,252,.75); --hero-chip:rgba(255,255,255,.10);
  --marker:#E9BC3A; --marker-ink:#16233B; --rule:#222E4A; --redrule:#6E3B44;
  --good:#58C892; --good-bg:#16352A; --bad:#F2857A; --bad-bg:#3A1F24; --warn:#F0C25A; --warn-bg:#3A3018;
  --scrim:rgba(0,0,0,.6); --shadow:0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 32px;display:flex;flex-direction:column;gap:18px}
body.has-tabs:not(.has-dock) .wrap{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
body.has-dock .wrap{padding-bottom:calc(var(--dock-h,120px) + 24px + env(safe-area-inset-bottom,0px))}
.label{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* Home hero (only Home) */
.hero{background:linear-gradient(160deg,var(--hero),var(--hero-2));color:var(--hero-ink);
  padding:calc(18px + env(safe-area-inset-top,0px)) 16px 22px;border-radius:0 0 26px 26px}
.hero-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.hero .eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--hero-muted);font-weight:700}
.hero h1{font-size:1.9rem;font-weight:800;line-height:1.05;letter-spacing:-.01em}
.hero-stats{display:flex;gap:8px;flex-wrap:wrap}
.hchip{display:inline-flex;align-items:center;gap:6px;background:var(--hero-chip);border-radius:999px;padding:6px 12px;font-size:.9rem;font-weight:700}
.hchip svg.i{width:18px;height:18px}
.hero .hint{color:var(--hero-muted)}

/* App bar (inner screens) */
.appbar{position:sticky;top:0;z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px}
.appbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(88px,1fr) auto minmax(88px,1fr);align-items:center;min-height:44px}
.appbar h2{font-size:1.05rem;font-weight:700;text-align:center;font-family:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.backbtn{justify-self:start;display:inline-flex;align-items:center;gap:2px;background:none;border:0;color:var(--accent);font-weight:700;min-height:44px;padding:0 8px 0 2px;font-size:1rem}
.backbtn svg.i{width:24px;height:24px}
.pagehead{display:flex;flex-direction:column;gap:4px}
.pagehead h1{font-size:1.6rem;font-weight:800;line-height:1.1}

/* Buttons */
.btn{border:0;border-radius:var(--r);padding:14px 18px;font-weight:700;font-size:1.05rem;min-height:54px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.soft{background:var(--surface);border:1.5px solid var(--line)}
.btn.warn{background:var(--bad-bg);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.backbtn:disabled,.iconbtn:disabled,.textbtn:disabled{opacity:.5;cursor:default}
.btn:active:not(:disabled),.tile:active,.mode:active:not(:disabled),.rowlink:active,.opt:active:not(:disabled),.chip:active{transform:scale(.98)}
.textbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:10px 0;min-height:44px}
.iconbtn{background:none;border:0;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 24px -18px rgba(22,35,59,.5)}
.dock-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dock .row{display:flex;gap:8px}.dock .row>.btn{flex:1}
body.has-tabs .dock{bottom:calc(62px + env(safe-area-inset-bottom,0px));padding-bottom:10px}
.cont{display:flex;align-items:center;gap:12px}
.cont .txt{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0}
.cont .txt b{display:block;font-size:.98rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont .txt span{display:block;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont .btn{flex:none;padding-inline:20px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:62px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.75rem;font-weight:700;color:var(--muted)}
.tab[aria-current="page"]{color:var(--accent)}
.tab .badge{position:absolute;top:-6px;left:14px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--surface);font-size:.68rem;line-height:18px;text-align:center}
.tab .plus{width:40px;height:30px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}

/* Cards, tiles, rows */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px;min-width:0}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;min-height:84px}
.tile .t{font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.15;overflow-wrap:anywhere}
.tile .s{color:var(--muted);font-size:.85rem}
.tile .s.bad{color:var(--bad);font-weight:700;margin-top:-4px}
.tile .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.tile .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.tile[disabled]{opacity:.55;cursor:default}
.sec-label{grid-column:1/-1;font-size:.78rem;font-weight:700;color:var(--muted);margin-top:4px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.rowlink{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px;text-align:left;min-height:64px}
.rowlink:last-child{border-bottom:0}
.rowlink .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rowlink .txt b{font-size:1.02rem}
.rowlink .txt span{font-size:.85rem;color:var(--muted)}
.rowlink .chev,.tile .chev{color:var(--muted)}
.mic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--bad-bg);color:var(--bad);flex:none}
.count-bad{background:var(--bad-bg);color:var(--bad);font-weight:700;border-radius:999px;padding:2px 9px;font-size:.85rem;white-space:nowrap}
.fixline{display:flex;align-items:center;gap:10px;width:100%;background:var(--warn-bg);color:var(--warn);border:0;border-radius:var(--r);padding:10px 12px;font-weight:700;text-align:left;min-height:44px}
.fixline span{flex:1}
.unit{display:flex;flex-direction:column;gap:10px}
.unit-head{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 0;width:100%;text-align:left;min-height:44px}
.unit-head .txt{flex:1;min-width:0}
.unit-head b{font-family:var(--display);font-size:1.1rem;font-weight:800;display:block}
.unit-head span{color:var(--muted);font-size:.85rem}
.unit-head .chev{transition:transform .2s;color:var(--muted)}
.unit-head[aria-expanded="true"] .chev{transform:rotate(90deg)}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.field-row{display:flex;flex-direction:column;gap:8px}
.hint{font-size:.85rem;color:var(--muted)}
.hint b{color:var(--ink)}
.note-line{font-size:.88rem;color:var(--muted)}

/* Choosers */
.seg{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));background:var(--line);border-radius:var(--r);padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:calc(var(--r) - 3px);min-height:44px;font-weight:700;color:var(--seg-ink);font-size:.95rem;padding:4px 6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(22,35,59,.18)}
.seg.small button{min-height:44px;font-size:.85rem}
.seg button:disabled{opacity:.4;cursor:default;text-decoration:line-through;text-decoration-thickness:1.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:44px;font-weight:700;font-size:.95rem}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.range{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:8px;align-items:center;border-radius:var(--r);padding:8px 10px;border:1.5px solid var(--line);background:var(--surface)}
.range.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.range label{font-size:.9rem;color:var(--muted);font-weight:700}
.range input,.field{min-width:0;font:inherit;font-size:1.1rem;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font-variant-numeric:tabular-nums}
.range:not(.on) input{color:var(--muted)}
.field{width:100%;font-size:1rem;padding:12px 14px}

/* Mode buttons */
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;min-height:72px}
.mode:disabled{opacity:.5;cursor:default}
.mode .ic{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.mode .txt{flex:1;min-width:0}
.mode .txt b{display:block;font-size:1.08rem;line-height:1.2}
.mode .txt span{display:block;font-size:.85rem;color:var(--muted)}
.mode .go{color:var(--accent)}
.mode.last{border-color:var(--accent)}
.mode .tag{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.flashopt{display:flex;align-items:center;gap:10px;margin:-2px 4px 2px 64px;font-size:.85rem;color:var(--muted)}
.flashopt .seg{flex:1;--cols:2}

/* Bottom sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:22px 22px 0 0;max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain;
  padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s ease;box-shadow:var(--shadow)}
.sheet.on{transform:none}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 0}
.sheet-head{display:flex;align-items:flex-start;gap:10px}
.sheet-head .txt{flex:1;min-width:0}
.sheet-head h2{font-size:1.45rem;font-weight:800;line-height:1.15}
.sheet-head p{color:var(--muted);font-size:.9rem}

/* Quiz: the index card, kept from the previous version */
.qtop{display:flex;align-items:center;gap:12px}
.qtop .bar{flex:1;margin:0}
.qtop .backbtn{color:var(--muted)}
.qcount{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;min-width:3.5em;text-align:right}
.qcard{border-radius:8px;border:1px solid var(--line);padding:12px 16px 18px;min-height:180px;display:flex;flex-direction:column;gap:12px;
  background:linear-gradient(to bottom,transparent 44px,var(--redrule) 44px,var(--redrule) 46px,transparent 46px),repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px),var(--surface);
  background-position:0 0,0 46px,0 0;box-shadow:0 1px 0 var(--line),0 8px 20px -12px rgba(22,35,59,.35)}
.qcard.tappable{cursor:pointer}
.qcard .ask{font-size:.85rem;color:var(--muted);height:20px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.qcard .tap-hint{font-size:.85rem;color:var(--muted);margin-top:auto}
.prompt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.big{font-family:var(--display);font-size:clamp(1.7rem,7vw,2.4rem);font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.big.sentence{font-family:var(--body);font-weight:700;font-size:clamp(1.25rem,5vw,1.5rem)}
.gap{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--accent);text-align:center}
.def{margin:0;font-size:1rem}
.hint-btn{background:none;border:0;padding:0 8px;margin-left:-8px;min-height:44px;color:var(--accent);font-weight:700;font-size:.9rem;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.say{border:1.5px solid var(--line);background:var(--surface);color:var(--accent);border-radius:999px;width:44px;height:44px;display:inline-grid;place-items:center;flex:none}
.say svg.i{width:22px;height:22px}
mark{background:linear-gradient(transparent 12%,var(--marker) 12%,var(--marker) 88%,transparent 88%);color:var(--marker-ink);padding:0 .15em;border-radius:2px}
.back{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:520px){.opts.short{grid-template-columns:1fr 1fr}}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:56px;font-size:1.02rem;display:flex;gap:10px;align-items:center}
.opt kbd{font-family:var(--body);font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;flex:none}
@media (hover:none){.opt kbd{display:none}}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt:disabled{cursor:default}
.typebox{display:flex;gap:8px}
.typebox input{flex:1;min-width:0;font:inherit;font-size:1.25rem;padding:12px 14px;min-height:56px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.typebox input.right{border-color:var(--good)} .typebox input.wrong{border-color:var(--bad)}
/* Write the forms (verbs): two fields one under the other, each with its label */
.typebox.two{flex-direction:column;gap:10px}
.typebox.two label{display:flex;flex-direction:column;gap:4px;min-width:0}
.typebox.two input{width:100%}
.typebox.two .btn{align-self:stretch}
.typebox .btn{padding-inline:16px}
.fb{border-radius:var(--r);padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb strong{font-size:1.05rem}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.score{font-family:var(--display);font-size:3.2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.words{display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:0;list-style:none}
.words li{background:var(--bad-bg);color:var(--bad);border-radius:6px;padding:3px 9px;font-weight:700}
textarea{width:100%;font:inherit;font-size:.9rem;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);resize:vertical}
@media (max-width:360px){.big{font-size:1.55rem}.qcard{min-height:150px}}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:left;font:inherit;color:inherit}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.stat.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.stat.bad span{color:inherit}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:.75rem;color:var(--muted);margin-top:8px}
.week i{display:block;width:30px;height:30px;margin:4px auto 0;border-radius:50%;border:1.5px solid var(--line)}
.week i.on{background:var(--accent);border-color:var(--accent)}
.week i.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.deckbar{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.deckbar:last-child{border-bottom:0}
.deckbar .bar{grid-column:1/-1}
.deckbar span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.log li:last-child{border-bottom:0}
.log li b{font-variant-numeric:tabular-nums;white-space:nowrap}

/* Add words */
.src{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px;min-height:88px}
.src[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.src .ic{width:50px;height:50px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.src b{display:block;font-size:1.1rem}.src span{color:var(--muted);font-size:.88rem}
.camera{position:relative;border:2px dashed var(--line);border-radius:var(--r-lg);background:var(--surface);min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;width:100%;overflow:hidden}
.camera .ic{width:72px;height:72px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.camera .ic svg.i{width:34px;height:34px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
.reading{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);max-height:340px;background:var(--surface)}
.reading img{display:block;width:100%;height:340px;object-fit:cover;object-position:top;opacity:.85}
.reading .scan{position:absolute;left:0;right:0;height:60px;background:linear-gradient(transparent,rgba(31,78,140,.4),transparent);animation:scan 1.6s linear infinite}
@keyframes scan{from{top:-60px}to{top:340px}}
.goes{display:flex;align-items:center;gap:12px}
.goes .txt{flex:1;min-width:0}
.goes b{display:block;font-size:1.05rem}
.rev{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:66px 1fr 44px;gap:6px 8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.wrow.tb{grid-template-columns:44px 1fr 44px}
.wrow input[type="text"],.wrow input:not([type]){min-width:0;width:100%;font:inherit;font-size:1rem;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--ink)}
.wrow .num{font-variant-numeric:tabular-nums;text-align:center;padding:8px 2px}
.wrow .pair{display:flex;flex-direction:column;gap:6px;min-width:0}
.wrow.flag{border-color:var(--warn);background:var(--warn-bg)}
.wrow.off{opacity:.55}
.wrow .note{grid-column:1/-1;display:flex;align-items:center;flex-wrap:wrap;gap:8px;color:var(--warn);font-size:.88rem;font-weight:700}
.wrow .note.info{color:var(--muted);font-weight:400}
.wrow .note span{flex:1;min-width:60%}
.wrow .note .textbtn{white-space:nowrap;padding:4px 14px;min-height:44px;border:1.5px solid var(--warn);border-radius:999px;color:var(--warn)}
.wrow .opts2{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.wrow .opts2 .chip{min-height:44px;padding:6px 12px;font-size:.9rem}
.check{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--accent);padding:0}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.done-mark{width:84px;height:84px;border-radius:50%;background:var(--good-bg);color:var(--good);display:grid;place-items:center;margin:24px auto 0}
.done-mark svg.i{width:44px;height:44px;stroke-width:2.6}
.fixcard{display:flex;flex-direction:column;gap:6px}
.fixcard .nr{font-family:var(--display);font-weight:800;font-size:1.1rem}
.fixcard s{color:var(--bad)}
.fixcard .ok{color:var(--good);font-weight:700}
.fixrow{display:flex;align-items:flex-start;gap:12px}
.fixrow .fixcard{flex:1;min-width:0}
.msgcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:8px 4px 4px}
.msgcard h1{font-size:1.5rem;line-height:1.15}
.done-mark.info{background:var(--accent-soft);color:var(--accent);margin:8px auto 4px}
.numcard{display:flex;flex-direction:column;gap:4px;background:var(--warn-bg);color:var(--warn);border:1.5px solid var(--warn);border-radius:var(--r);padding:12px 14px;font-size:.92rem}
.numcard b{font-size:1rem}
#dupline,#skipline{font-size:1rem;color:var(--ink)}
.reread{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}
.reread span{font-size:.9rem;color:var(--muted);flex-basis:100%}
.reread .chip{min-height:44px;padding:6px 14px;font-size:.92rem}
.infoline{display:flex;align-items:flex-start;gap:10px;background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:10px 12px;font-size:.92rem}
.infoline svg.i{color:var(--accent);margin-top:1px}
#topcard .chip{max-width:100%;overflow-wrap:anywhere}
.undo{display:flex;flex-direction:column;align-items:center;gap:4px}
.undo .btn{min-height:48px;padding:10px 22px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;font-size:.92rem;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const formList=v=>(Array.isArray(v)?v:String(v==null?"":v).split("/")).map(x=>String(x==null?"":x).trim()).filter(Boolean);
/* one deck of textbook.json (a Focus section, a topic or the irregular verbs): null when the type is unknown or nothing is left.
   Type "verbs" (25.10.2026) is only accepted from the list "verbs" (verbsList), never inside a unit or a topic. */
function tbDeck(dk,decks,verbsList){
  if(!dk||!dk.id||dk.id==="nb"||decks[dk.id]||/^unit\d/.test(dk.id))return null;
  const type=dk.type||"vocab";if(!["vocab","opposites","prep"].concat(verbsList?["verbs"]:[]).includes(type))return null; /* unknown type: no deck */
  const items=(Array.isArray(dk.items)?dk.items:[]).filter(it=>it&&typeof it==="object").map(it=>type==="opposites"?{id:String(it.id),base:it.base,opp:it.opp,bg:it.bg||"",ex:it.ex||[]}
    :type==="prep"?{id:String(it.id),label:it.label,acc:it.acc||[],s:it.s,bg:it.bg||""}
    :type==="verbs"?{id:String(it.id||it.inf),inf:String(it.inf||"").trim(),past:formList(it.past),pp:formList(it.pp),bg:it.bg||""}
    :{id:String(it.id),en:it.en,bg:it.bg||"",def:it.def||""})
    .filter(it=>type==="opposites"?it.base&&it.opp:type==="prep"?it.s&&it.acc.length:type==="verbs"?it.inf&&it.past.length&&it.pp.length:it.en);
  return items.length?{name:dk.name||dk.id,type,items}:null}
function setTextbook(tb){
  if(!tb||!Array.isArray(tb.units))return false;
  const decks={},units=[];
  tb.units.forEach(u=>{
    const unit={n:String(u.id),num:parseInt(u.id,10)||0,topic:u.topic||"",sections:[],sets:[]};
    (u.sections||[]).forEach(s=>{
      const sec={id:String(s.id),lessons:(s.lessons||[String(s.id)]).map(String),title:s.title||"",decks:[]};
      (s.decks||[]).forEach(dk=>{const D=tbDeck(dk,decks);if(!D)return;
        decks[dk.id]=Object.assign(D,{unit:unit.n,section:sec.id});
        sec.decks.push(dk.id);unit.sets.push(dk.id);
      });
      if(sec.decks.length)unit.sections.push(sec);
    });
    if(!unit.sets.length)return;
    if(!unit.topic)unit.topic=unit.sections[0].title||"";
    /* sections stay oldest first (topic, lessons); Home, Mistakes and Progress show them newest first */
    unit.view=[...unit.sections].sort((a,b)=>b.id.localeCompare(a.id,"en",{numeric:true}));
    unit.sub=unit.view.map(s=>s.id).join(", ");
    if(unit.sets.length>=2)decks["unit"+unit.n]={name:"All of Unit "+unit.n,type:"mix",mix:true,unit:unit.n,
      items:unit.sets.flatMap(d=>decks[d].items.map(it=>({id:d+":"+it.id,d,it})))};
    units.push(unit);
  });
  if(!units.length)return false;
  /* Topics (v4.4): the teacher's sheets, one deck per topic (T-<id>), newest first; never part of a unit */
  const topics=[];
  (Array.isArray(tb.topics)?tb.topics:[]).forEach(t=>{if(!t||!t.id||topics.some(x=>x.id===String(t.id)))return;
    const tp={id:String(t.id),title:String(t.title||t.id),updated:String(t.updated||""),sources:(Array.isArray(t.sources)?t.sources:[]).filter(Boolean).map(String),sets:[]};
    (Array.isArray(t.decks)?t.decks:[]).forEach(dk=>{const D=tbDeck(dk,decks);if(!D)return;decks[dk.id]=Object.assign(D,{topic:tp.id});tp.sets.push(dk.id)});
    if(tp.sets.length)topics.push(tp)});
  /* Irregular verbs (25.10.2026): the list "verbs" next to units and topics, decks of type "verbs" (id "irr"); not part of
     any unit, so "All of Unit n" never has them. A deck without valid inf/past/pp items is skipped like the other types. */
  const verbs=[];
  (Array.isArray(tb.verbs)?tb.verbs:[]).forEach(dk=>{const D=tbDeck(dk,decks,true);if(!D||D.type!=="verbs")return;
    decks[dk.id]=Object.assign(D,{verbs:true,source:String(dk.source||"")});verbs.push(dk.id)});
  Object.keys(DECKS).forEach(k=>{if(k!=="nb")delete DECKS[k]});
  Object.assign(DECKS,decks);
  UNITS=units.sort((a,b)=>b.num-a.num||String(b.n).localeCompare(String(a.n)));
  TOPICS=topics.sort((a,b)=>b.updated.localeCompare(a.updated)||a.title.localeCompare(b.title));
  VERBS=verbs;
  TB=tb;return true;
}

function merge(a,b){

const choiceDirs=d=>twoDir(d)||isVerbs(d);

const dirMatters=(d,mode)=>mode==="choice"?choiceDirs(d):mode==="type"&&isVerbs(d);
function modeTitle(d,mode,dir){const ms=modesFor(d);const m=ms.find(x=>x.mode===mode&&(!dirMatters(d,mode)||x.dir===dir))||ms.find(x=>x.mode===mode);return m?m.t:mode}
function deckTitle(d,p=S.pref){const D=DECKS[d];if(!D)return "Practice";if(D.mix)return "Unit "+D.unit+" · all sets";if(d==="nb")return "Notebook · "+nbLabel(p);return D.name+" · "+deckWhere(d)}
function prefValid(p=S.pref){return !!DECKS[p.deck]&&modesFor(p.deck).some(m=>m.mode===p.mode)}
function prefSummary(p=S.pref){const d=p.deck;const items=deckItems(d,p);const n=p.n==="all"?items.length:Math.min(p.n,items.length);
  const fl=p.mode==="flash"&&twoDir(d)&&p.dir==="bg"?" (Bulgarian first)":"";
  return{what:deckTitle(d,p),how:modeTitle(d,p.mode,p.dir)+fl+" · "+plural(n,unitWord(d))}}

/* ---------- navigation: an in-app stack; every inner screen has a visible way back ---------- */
const SCREENS={};
const NAV={stack:[]};
let TAB="home";
function go(name,params={}){NAV.stack.push({name,params});render()}
function replace(name,params={}){NAV.stack.pop();NAV.stack.push({name,params});render()}
function back(){if(NAV.stack.length>1)NAV.stack.pop();render()}
function resetTo(name,params={}){NAV.stack=[{name,params}];render()}
const top_=()=>NAV.stack[NAV.stack.length-1];
/* ---------- the phone's back (DEF-36): one browser history entry while the app is off its root ----------
   On an inner screen, or with a panel open, the app keeps one extra history entry with the same address (the link
   with the key is never changed). Back takes it away and the app does what its own back control does there; then the
   entry comes back if the app is still off its root. On a root screen there is no entry, so back leaves the app as before.
   Where history can't be used (inside Google's /exec it may throw) nothing changes. */
const HIST={on:true,armed:false,skip:0,queued:false};
const offRoot=()=>SHEET_OPEN||NAV.stack.length>1;
function histSync(){if(HIST.queued)return;HIST.queued=true;
  Promise.resolve().then(()=>{HIST.queued=false;if(!HIST.on||HIST.skip)return;
    try{if(offRoot()&&!HIST.armed){history.pushState({wt:1},"",location.href);HIST.armed=true}
      else if(!offRoot()&&HIST.armed){HIST.armed=false;HIST.skip++;history.back();
        setTimeout(()=>{if(HIST.skip){HIST.skip=0;histSync()}},1500)}}
    catch(e){HIST.on=false}})}
/* what the app's own back control does on this screen; a read or a save that is running is not interrupted */
function appBack(){if(SHEET_OPEN){closeSheet();return}
  const t=top_();if(!t||NAV.stack.length<2)return;
  if(ADD.saving){toast("Saving the words. Please wait.");return}
  if(ADD.busy&&t.name==="addReading"||ADD.opening&&t.name==="addPhoto"){toast("Reading the page. Tap Cancel to stop.");return}
  const b=$("#app .backbtn");if(b){if(!b.disabled)b.click();return}
  goHome()}
window.addEventListener("popstate",e=>{if(!HIST.on)return;
  if(HIST.skip){HIST.skip--;histSync();return}
  if(e.state&&e.state.wt){HIST.armed=true;histSync();return} /* forward onto the app's entry */
  if(!HIST.armed)return;
  HIST.armed=false;appBack();histSync()});
try{if(history.state&&history.state.wt)HIST.armed=true}catch(e){HIST.on=false} /* reloaded on the app's entry: it goes away at once */
const parentLabel=()=>{const p=NAV.stack[NAV.stack.length-2];return p&&SCREENS[p.name]?(SCREENS[p.name].label||"Back"):"Back"};
function render(){closeSheet(true);const cur=top_();const scr=SCREENS[cur.name](cur.params)||{};
  document.body.dataset.screen=cur.name;
  $("#app").innerHTML=scr.html||"";window.scrollTo(0,0);
  setTabs(scr.tab||null);setDock(scr.dock||"");
  if(scr.after)scr.after();histSync()}
function appbar(title,opts={}){const backLbl=opts.backLabel||parentLabel();
  return `<header class="appbar"><div class="appbar-in">
    ${opts.noBack?"<span></span>":`<button class="backbtn" ${opts.backId?`id="${opts.backId}"`:"data-back"}>${icon("back")}${esc(backLbl)}</button>`}
    <h2>${esc(title)}</h2><span></span></div></header>`}
document.addEventListener("click",e=>{if(e.target.closest("[data-back]")){e.preventDefault();back()}});
function setDock(html){const d=$("#dock");if(!html){d.hidden=true;d.innerHTML="";document.body.classList.remove("has-dock");return}
  d.innerHTML='<div class="dock-in">'+html+'</div>';d.hidden=false;document.body.classList.add("has-dock");
  const upd=()=>document.body.style.setProperty("--dock-h",d.offsetHeight+(document.body.classList.contains("has-tabs")?62:0)+"px");
  upd();requestAnimationFrame(upd)}
function setTabs(tab){let t=$("#tabbar");
  if(!tab){if(t)t.remove();document.body.classList.remove("has-tabs");return}
  if(!t){t=document.createElement("nav");t.id="tabbar";t.className="tabbar";t.setAttribute("aria-label","Main");document.body.appendChild(t)}
  document.body.classList.add("has-tabs");const tm=totalMistakes();
  const T=[["home","home","Home"],["mistakes","redo","Mistakes"],["add","plus","Add words"],["progress","chart","Progress"]];
  t.innerHTML=`<div class="tabbar-in">${T.map(([k,ic,l])=>`<button class="tab" data-tab="${k}" ${k===tab?'aria-current="page"':""}>${k==="add"?`<span class="plus">${icon("plus")}</span>`:`<span style="position:relative;display:grid">${icon(ic)}${k==="mistakes"&&tm?`<b class="badge">${tm}</b>`:""}</span>`}${l}</button>`).join("")}</div>`;
  t.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{const k=b.dataset.tab;
    if(k==="add"){startAdd();return}
    if(k===TAB&&NAV.stack.length===1){window.scrollTo(0,0);return}
    TAB=k;resetTo(k,{root:true})})}
function goHome(){TAB="home";resetTo("home",{root:true})}

/* ---------- bottom sheet ---------- */
let SHEET_OPEN=false;
function openSheet(html,after){closeSheet(true);const sc=document.createElement("div");sc.className="scrim";sc.id="scrim";
  const sh=document.createElement("section");sh.className="sheet";sh.id="sheet";sh.setAttribute("role","dialog");sh.setAttribute("aria-modal","true");
  sh.innerHTML='<div class="sheet-in"><div class="grab" aria-hidden="true"></div>'+html+'</div>';
  document.body.append(sc,sh);SHEET_OPEN=true;histSync();requestAnimationFrame(()=>{sc.classList.add("on");sh.classList.add("on")});
  sc.onclick=()=>closeSheet();
  let y0=null;sh.addEventListener("touchstart",e=>{if(sh.scrollTop<=0&&!e.target.closest("input"))y0=e.touches[0].clientY},{passive:true});
  sh.addEventListener("touchmove",e=>{if(y0!==null){const dy=e.touches[0].clientY-y0;if(dy>0)sh.style.transform=`translateY(${dy}px)`}},{passive:true});
  sh.addEventListener("touchend",e=>{if(y0===null)return;const dy=e.changedTouches[0].clientY-y0;y0=null;sh.style.transform="";if(dy>90)closeSheet()});
  if(after)after(sh)}
function closeSheet(now){histSync();const sc=$("#scrim"),sh=$("#sheet");if(!sh){SHEET_OPEN=false;return}SHEET_OPEN=false;
  if(now){if(sc)sc.remove();sh.remove();return}if(sc)sc.classList.remove("on");sh.classList.remove("on");setTimeout(()=>{if(sc)sc.remove();sh.remove()},220)}

/* ---------- the "how" panel: range (notebook), count, modes ---------- */
function modePanel(d,draft){
  const items=deckItems(d,draft);const c=counts(d,items);const ms=modesFor(d);
  const last=(S.pref.lastByDeck||{})[d]||(S.pref.deck===d?{mode:S.pref.mode,dir:S.pref.dir}:null);
  const nAll=items.length;const custom=!!draft._custom;
  const latestOn=v=>!custom&&(v?draft.nbLast===v:!draft.nbLast&&(+draft.nbFrom||1)===1&&!draft.nbTo);
  const rangeHtml=d==="nb"?`<div class="field-row"><span class="label">Which words</span>
      <div class="seg" style="--cols:3">${[[20,"Latest 20"],[50,"Latest 50"],[0,"All"]].map(([v,l])=>`<button data-last="${v}" aria-pressed="${latestOn(v)}">${l}</button>`).join("")}</div>
      <div class="range${custom||(!draft.nbLast&&!latestOn(0))?" on":""}" id="rng"><label for="nbf">From #</label><input id="nbf" type="number" inputmode="numeric" min="1" value="${esc(nbBounds(draft)[0])}"><label for="nbt">to #</label><input id="nbt" type="number" inputmode="numeric" min="1" value="${esc(nbBounds(draft)[1])}"></div>
      <p class="hint" id="nbcount">${nbCountHtml(nAll)}</p></div>`:"";
  return `${rangeHtml}
    <div class="field-row"><span class="label">How many words</span>
      <div class="seg small" style="--cols:3">${[["10","10"],["20","20"],["all","All "+nAll]].map(([v,l])=>`<button data-n="${v}" ${nOver(v,nAll)?"disabled ":""}aria-pressed="${nSel(draft.n,nAll)===v}">${l}</button>`).join("")}</div></div>
    <div class="field-row"><span class="label">Start practising</span>
    <div class="modes">${ms.map(m=>{const isLast=!!last&&last.mode===m.mode&&(!dirMatters(d,m.mode)||last.dir===m.dir);
      return `<button class="mode${isLast?" last":""}" data-mode="${m.k}" ${nAll?"":"disabled"}><span class="ic">${m.ic}</span><span class="txt">${isLast?'<span class="tag">Last time</span>':""}<b>${m.t}</b><span>${m.s}</span></span><span class="go">${icon("play")}</span></button>`+
      (m.k==="flash"&&twoDir(d)?`<div class="flashopt"><span>Show first</span><div class="seg small"><button data-fdir="en" aria-pressed="${(draft.flashDir||"en")!=="bg"}">English</button><button data-fdir="bg" aria-pressed="${draft.flashDir==="bg"}">Bulgarian</button></div></div>`:"")}).join("")}
    </div></div>
    ${c.mist?`<button class="btn warn block" id="fixm">${icon("redo")} Practise mistakes (${c.mist})</button>`:""}`;
}
/* "10"/"20" are not offered when the set has that many words or fewer: "All n" is the same */
const nOver=(v,all)=>v!=="all"&&all>0&&+v>=all;
const nSel=(n,all)=>nOver(String(n),all)?"all":String(n);
function syncN(root,n,cur){root.querySelectorAll("[data-n]").forEach(x=>{x.disabled=nOver(x.dataset.n,n);x.setAttribute("aria-pressed",String(nSel(cur,n)===x.dataset.n))})}
const nbCountHtml=n=>n?`<b>${plural(n,"word")}</b> · your notebook goes up to #${esc(nbLastId())}`:`<b style="color:var(--bad)">No words in this range.</b> Your notebook goes from #1 to #${esc(nbLastId())}.`;
function wireModePanel(root,d,draft,rerender){
  const q=s=>root.querySelector(s);
  root.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{draft.n=b.dataset.n==="all"?"all":+b.dataset.n;root.querySelectorAll("[data-n]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))});
  root.querySelectorAll("[data-fdir]").forEach(b=>b.onclick=()=>{draft.flashDir=b.dataset.fdir;root.querySelectorAll("[data-fdir]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))});
  root.querySelectorAll("[data-last]").forEach(b=>b.onclick=()=>{const v=+b.dataset.last;draft._custom=false;draft.nbLast=v;if(!v){draft.nbFrom=1;draft.nbTo=""}rerender()});
  const f=q("#nbf"),t=q("#nbt");
  if(f){const apply=()=>{draft._custom=true;draft.nbLast=0;draft.nbFrom=f.value?+f.value:1;draft.nbTo=t.value?+t.value:"";
      q("#rng").classList.add("on");root.querySelectorAll("[data-last]").forEach(x=>x.setAttribute("aria-pressed","false"));
      const n=nbRange(draft).length;q("#nbcount").innerHTML=nbCountHtml(n);
      const all=root.querySelector('[data-n="all"]');if(all)all.textContent="All "+n;syncN(root,n,draft.n);
      root.querySelectorAll("[data-mode]").forEach(b=>b.disabled=!n);const fm=q("#fixm");if(fm)fm.disabled=!n};
    f.oninput=apply;t.oninput=apply;
    [f,t].forEach(x=>x.onfocus=()=>{q("#rng").classList.add("on")})}
  root.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{const m=modesFor(d).find(x=>x.k===b.dataset.mode);
    const p=Object.assign({},draft,{deck:d,mode:m.mode,dir:m.dir===null?(draft.flashDir||"en"):m.dir});startQuiz(p,false)});
  const fm=q("#fixm");if(fm)fm.onclick=()=>{const last=(S.pref.lastByDeck||{})[d];
    const p=Object.assign({},draft,{deck:d},last&&modesFor(d).some(m=>m.mode===last.mode)?last:{mode:"choice",dir:"en"});startQuiz(p,true)};
}
function openDeckSheet(d){
  if(!DECKS[d])return;
  if(d==="nb"&&!nbAll().length){toast(NB_STATE==="loading"?"Your notebook is still loading.":NB_STATE==="empty"?NB_MSG.empty:"Your notebook could not be loaded.");return}
  const draft=Object.assign({},S.pref);
  if(d!=="nb"&&S.pref.deck!==d){/* keep count and flash setting, the range is only for the notebook */}
  const D=DECKS[d];
  const small=d==="nb"?"Your vocabulary notebook":D.mix?"Focus · "+unitOf(D.unit).view.flatMap(s=>s.decks).map(x=>DECKS[x].name).join(", ")
    :D.topic?"Topic sheet"+((topicOf(D.topic)||{sources:[]}).sources.length?" · "+topicOf(D.topic).sources.join(", "):"")
    :D.verbs?verbsWhere(d):"Unit "+D.unit+" · Focus";
  const draw=sh=>{const c=counts(d,D.items);
    sh.querySelector(".sheet-in").innerHTML=`<div class="grab" aria-hidden="true"></div>
      <div class="sheet-head"><div class="txt"><p>${esc(small)}</p><h2>${esc(D.name)}</h2>
      <p>${c.learned} of ${D.items.length} learned</p></div><button class="iconbtn" data-close aria-label="Close">${icon("x")}</button></div>
      ${modePanel(d,draft)}`;
    sh.querySelector("[data-close]").onclick=()=>closeSheet();
    wireModePanel(sh,d,draft,()=>{const y=sh.scrollTop;draw(sh);sh.scrollTop=y})};
  openSheet("",draw)}

/* ---------- Home ---------- */
let OPEN_UNIT=null,SHOW_MORE_TOPICS=false;
function deckTile(d){const D=DECKS[d];const c=counts(d,D.items);
  return `<button class="tile" data-deck="${esc(d)}"><span class="t">${esc(D.name)}</span>

function allTile(u){const d="unit"+u.n;if(!DECKS[d])return "";const c=counts(d,DECKS[d].items);
  return `<button class="tile wide" data-deck="${d}" style="min-height:70px"><span class="ic">${icon("words")}</span><span class="col">
    <span class="t" style="font-size:1.05rem">All of Unit ${esc(u.n)}</span><span class="s">${u.sets.length} sets mixed · ${plural(c.total,"word")}</span>${c.mist?`<span class="s bad">${plural(c.mist,"mistake")}</span>`:""}
    <span class="bar"><i style="width:${pct(c.learned,c.total)}%"></i></span></span>${icon("chev","chev")}</button>`}
const openUnit=()=>OPEN_UNIT===null?(UNITS[0]?UNITS[0].n:""):OPEN_UNIT;
function unitBlock(u){const open=openUnit()===u.n;const tot=u.sets.reduce((a,d)=>a+DECKS[d].items.length,0);
  const grouped=u.view.length>1;
  return `<div class="unit"><button class="unit-head" data-unit="${esc(u.n)}" aria-expanded="${open}"><span class="txt"><b>Unit ${esc(u.n)}${u.topic?" · "+esc(u.topic):""}</b><span>${esc(u.sub)} · ${plural(u.sets.length,"set")} · ${plural(tot,"word")}</span></span>${icon("chev","chev")}</button>
    ${open?`<div class="tiles">${allTile(u)}${u.view.map(s=>(grouped?`<span class="sec-label">${esc(s.id)}${s.title?" · "+esc(s.title):""}</span>`:"")+s.decks.map(deckTile).join("")).join("")}</div>`:""}</div>`}
/* Irregular verbs (25.10.2026): one wide tile per verbs deck (there is one, "irr"): verbs, learned, mistakes */
const verbsWhere=d=>{const m=String(DECKS[d]&&DECKS[d].source||"").match(/p\.\s*[\d\s-]+\d/);return "Focus"+(m?" · "+m[0].replace(/\s+/g," "):"")};
function verbsTile(d){const D=DECKS[d];const c=counts(d,D.items);

const verbsHtml=()=>`<div class="tiles">${VERBS.map(verbsTile).join("")}</div>`;
function unitsHtml(){const L=UNITS;if(!L.length)return `<p class="hint">The textbook words are not available right now.</p>`;
  /* 23.10.2026 (Miro): every unit is listed, newest first, no "Older units" group; the newest is open by default. */

/* Topics on Home: the 4 newest topics, the others folded into "More topics (n)" */
function topicsHtml(){const head=TOPICS.slice(0,4),more=TOPICS.slice(4);
  const tiles=L=>`<div class="tiles">${L.flatMap(t=>t.sets).map(deckTile).join("")}</div>`;

function nbTile(){const all=nbAll();

    <span class="bar"><i style="width:${pct(c.learned,c.total)}%"></i></span></span>${icon("chev","chev")}</button>`}
function contPref(){return prefValid(S.pref)?S.pref:Object.assign({},S.pref,{deck:DECKS.words?"words":realDecks()[0]||"nb",mode:"choice",dir:"en"})}

/* ---------- Mistakes ---------- */
SCREENS.mistakes=()=>{const L=allMistakes();const tot=L.reduce((a,x)=>a+x.n,0);
  return{tab:"mistakes",html:appbar("Mistakes",{noBack:true})+`<div class="wrap">

      :`<div class="card" style="text-align:center;padding:28px 16px"><div class="done-mark" style="margin-top:0">${icon("check")}</div><h2 style="margin-top:12px">No mistakes</h2><p class="muted">Nice work. New mistakes show up here.</p></div>`}

const PREP_POOL=["in","on","at","of","about","for","to","with","from","by"];
function distractors(d,it,n,keyFn){
  const D=DECKS[d];let base=D.items;
  if(d==="nb"){const r=nbRange(Q?Q.p:S.pref);if(r.length>=8)base=r}
  else if(D.type==="vocab"&&base.length<8)base=base.concat(realDecks().filter(x=>x!==d&&DECKS[x].type==="vocab").flatMap(x=>DECKS[x].items));
  const mine=norm(keyFn(it).t);
  let pool=base.filter(x=>x!==it&&norm(keyFn(x).t)!==mine);
  const t=bgTokens(it.bg);pool=pool.filter(x=>![...bgTokens(x.bg)].some(w=>t.has(w)));
  const seen=new Set();
  return shuffle(pool).filter(x=>{const k=norm(keyFn(x).t);if(seen.has(k))return false;seen.add(k);return true}).slice(0,n).map(keyFn);
}
/* ---------- irregular verbs (25.10.2026) ---------- */
/* the regular -ed form, the wrong answer a learner reaches for: go -> goed, make -> maked, cut -> cutted, cry -> cried */
function edForm(v){v=String(v||"").trim().toLowerCase();if(!v)return "";
  if(/e$/.test(v)&&v.length>2)return v+"d"; /* be -> beed */
  if(/[^aeiou]y$/.test(v))return v.slice(0,-1)+"ied";
  if(/^[^aeiou]*[aeiou][^aeiouwxy]$/.test(v))return v+v.slice(-1)+"ed"; /* one short syllable ending in a consonant: doubled */
  return v+"ed"}
const verbForms=it=>it.inf+" · "+it.past.join("/")+" · "+it.pp.join("/");
const verbSay=it=>[it.inf,it.past[0],it.pp[0]].join(", ");
/* 3 wrong options for "What is the past simple / past participle of X?": the -ed form, the other form of the same verb when it
   differs, then forms of other verbs that look or sound alike (same ending first, then the same first letter), never a form
   that is a correct answer here, never the infinitive, never the same text twice */
function verbDistractors(D,it,which){
  const right=new Set(it[which].map(norm));const taken=new Set([...right,norm(it.inf)]);const out=[];
  const add=w=>{const k=norm(w);if(!k||taken.has(k))return false;taken.add(k);out.push(w);return true};
  add(edForm(it.inf));
  (which==="past"?it.pp:it.past).forEach(add);
  const target=norm(it[which][0]);const tail=target.slice(-2);
  const others=shuffle(D.items.filter(x=>x!==it).flatMap(x=>[x.past[0],x.pp[0]]));
  const score=w=>{const k=norm(w);return (k.endsWith(tail)?2:0)+(k[0]===target[0]?1:0)};
  others.sort((a,b)=>score(b)-score(a));
  for(const w of others){if(out.length>=3)break;add(w)}
  return out.slice(0,3).map(t=>({t}))}
function build(d,it,mode,dir){
  const D=DECKS[d];
  if(D.mix)return build(it.d,it.it,mode,"en");
  if(D.type==="verbs"){
    const forms=verbForms(it),say=verbSay(it);
    if(mode==="flash")return{dtype:"verbs",ask:"Irregular verb",prompt:it.inf,lang:"en",sayPrompt:it.inf,sub:it.bg,subLang:"bg",answer:forms,say};
    const F={inf:{key:"inf",label:"Infinitive",ph:"infinitive",accept:[it.inf]},past:{key:"past",label:"Past Simple",ph:"past simple",accept:acceptForms(it.past)},
      pp:{key:"pp",label:"Past Participle",ph:"past participle",accept:acceptForms(it.pp)}};
    /* Write the forms: the verb and the translation, two fields; Meaning: the translation only, three fields (the verb too) */
    if(mode==="type"&&dir==="bg")return{dtype:"verbs",ask:"Write the verb and its forms in English",prompt:it.bg,lang:"bg",fields:[F.inf,F.past,F.pp],answer:forms,say};
    if(mode==="type")return{dtype:"verbs",ask:"Write the past simple and the past participle",prompt:it.inf,lang:"en",sayPrompt:it.inf,sub:it.bg,subLang:"bg",
      fields:[F.past,F.pp],answer:forms,say};
    const which=Math.random()<.5?"past":"pp";const f=it[which];
    return{dtype:"verbs",ask:"What is the "+(which==="past"?"past simple":"past participle")+" of …?",prompt:it.inf,lang:"en",sayPrompt:it.inf,sub:it.bg,subLang:"bg",
      answer:forms,say,extra:f.length>1?"Also correct: "+f.slice(1).join(", "):"",options:shuffle([{t:f[0],ok:true},...verbDistractors(D,it,which)])};
  }
  if(D.type==="vocab"){
    /* Write the word and How do you say it (08.11.2026): the example sentence usually contains the answer, so it comes
       only after the answer; the Hint is the notebook one (first letter, number of letters) */
    const first=cleanSay(it.en);
    const q=mode==="type"?{ask:"Write the word in English",prompt:it.bg,lang:"bg",sub:"Starts with “"+first[0]+"”, "+first.replace(/[^a-z]/gi,"").length+" letters",subHidden:true,
        accept:[it.en],answer:it.en,extra:it.def||"",say:it.en}
      :dir==="bg"?{ask:"How do you say it in English?",prompt:it.bg,lang:"bg",sub:"Starts with “"+first[0]+"”, "+first.replace(/[^a-z]/gi,"").length+" letters",subHidden:true,answer:it.en,extra:it.def,say:it.en,
        options:shuffle([{t:it.en,ok:true},...distractors(d,it,3,x=>({t:x.en}))])}
      :{ask:"What does it mean?",prompt:it.en,lang:"en",sayPrompt:it.en,answer:it.bg,extra:it.def,say:it.en,
        options:shuffle([{t:it.bg,ok:true},...distractors(d,it,3,x=>({t:x.bg}))])};
    q.dtype="vocab";return q;
  }
  if(D.type==="nb"){
    const tag="#"+it.id+" · ";let q;
    if(mode==="type"){
      const same=DECKS.nb.items.filter(x=>x.bg===it.bg);const acc=[...new Set(same.flatMap(x=>variants(x.en)))];
      const first=cleanSay(it.en);
      q={ask:tag+"Write the word in English",prompt:it.bg,lang:"bg",sub:"Starts with “"+first[0]+"”, "+first.replace(/[^a-z]/gi,"").length+" letters",subHidden:true,accept:acc,answer:it.en,say:cleanSay(it.en),
        extra:same.length>1?"Also correct: "+same.filter(x=>x!==it).map(x=>x.en).join(", "):""};
    }else if(dir==="bg")q={ask:tag+"How do you say it in English?",prompt:it.bg,lang:"bg",answer:it.en,say:cleanSay(it.en),
      options:shuffle([{t:it.en,ok:true},...distractors(d,it,3,x=>({t:x.en}))])};
    else q={ask:tag+"What does it mean?",prompt:it.en,lang:"en",sayPrompt:cleanSay(it.en),answer:it.bg,say:cleanSay(it.en),
      options:shuffle([{t:it.bg,ok:true},...distractors(d,it,3,x=>({t:x.bg}))])};
    q.dtype="nb";return q;
  }
  if(D.type==="opposites"){
    const base={dtype:"opposites",ask:"What is the opposite?",prompt:it.base,lang:"en",sayPrompt:it.base,sub:it.bg,subHidden:true,accept:[it.opp],answer:it.opp,extra:it.bg,say:it.opp};
    if(mode==="choice"){
      const pre=["un","in","im","dis"];if(/^r/.test(it.base))pre.push("ir");if(/^l/.test(it.base))pre.push("il");
      const right=it.opp;let wrong=pre.map(p=>p+it.base).filter(w=>w!==right&&!(it.ex||[]).some(x=>w===x+it.base));
      if(/^(im|ir|il)/.test(right))wrong.unshift("i"+it.base); /* spelling trap: single letter */
      wrong=[...new Set(wrong)];
      const picked=(/^(im|ir|il)/.test(right)?[wrong[0],...shuffle(wrong.slice(1)).slice(0,2)]:shuffle(wrong).slice(0,3));
      base.options=shuffle([{t:right,ok:true},...picked.map(t=>({t}))]);
    }
    return base;
  }
  /* prep */
  const filled=esc(it.s).replace("___","<mark>"+esc(it.acc[0])+"</mark>");
  const o={dtype:"prep",ask:"Which preposition is missing?",prompt:it.s,lang:"en",sentence:true,sub:it.bg,subHidden:true,accept:it.acc,answer:it.label,
    answerHtml:filled,extra:it.acc.length>1?"Also correct: "+it.acc.slice(1).join(", "):"",say:it.s.replace("___",it.acc[0])};
  if(mode==="choice"){const wrong=shuffle(PREP_POOL.filter(p=>!it.acc.includes(p))).slice(0,3);
    o.options=shuffle([{t:it.acc[0],ok:true},...wrong.map(t=>({t}))])}
  return o;
}
function checkTyped(input,accept){
  const n=norm(input);if(!n)return "empty";
  for(const a of accept){const t=norm(a);if(n===t)return "ok";if(n.replace(/[-\s]/g,"")===t.replace(/[-\s]/g,""))return "hyphen"}
  for(const a of accept){const t=norm(a);if(t.length>3&&lev(n,t)===1)return "near"}
  return "bad";
}
/* accepted answers for one verb form: each variant alone ("was", "were") and the variants written together ("was/were", "was, were") */
function acceptForms(list){const out=list.slice();if(list.length>1){const r=list.slice().reverse();[list,r].forEach(l=>{out.push(l.join("/"),l.join(", "),l.join(" "))})}return out}
function itemLabel(d,it){const D=DECKS[d];if(!D||!it)return "";if(D.mix)return itemLabel(it.d,it.it);
  return D.type==="nb"?it.en+" (#"+it.id+")":D.type==="opposites"?it.opp:D.type==="prep"?it.label:D.type==="verbs"?it.inf:it.en}

let Q=null;
function pick(d,p,onlyMistakes){let items=deckItems(d,p);if(onlyMistakes)items=items.filter(x=>isMistake(d,x.id));
  const sc=items.map(it=>{const s=st(d,it.id);return{it,k:(s?s.b:-1)+Math.random()*1.6}}).sort((a,b)=>a.k-b.k);
  return shuffle(sc.slice(0,onlyMistakes||p.n==="all"?sc.length:p.n).map(x=>x.it))}
/* p: settings; onlyMistakes: only words to review; items: a ready list (e.g. "Practise these again") */
function startQuiz(p,onlyMistakes,items){
  p=Object.assign({},S.pref,p);delete p._custom;
  const d=p.deck;if(!DECKS[d]){toast("This set is not available right now.");return}
  if(!modesFor(d).some(m=>m.mode===p.mode)){p.mode="choice";p.dir="en"}
  const list=items||pick(d,p,onlyMistakes);
  if(!list.length){toast(onlyMistakes?"No mistakes to practise here.":"No words to practise here.");return}
  const lbd=Object.assign({},S.pref.lastByDeck,{[d]:{mode:p.mode,dir:p.dir}});
  if(!onlyMistakes&&!items)S.pref=Object.assign({},p);
  S.pref.lastByDeck=lbd;if(p.flashDir)S.pref.flashDir=p.flashDir;
  save();
  Q={p,deck:d,mode:p.mode,dir:p.dir,mistakes:!!onlyMistakes,queue:list.map(it=>({it,retry:false})),i:0,first:new Map(),
    items:new Map(list.map(it=>[it.id,it])),total:list.length,log:[]};
  closeSheet(true);go("quiz")}
function answer(ok){
  const cur=Q.queue[Q.i];const id=cur.it.id;
  if(!Q.first.has(id)){Q.first.set(id,ok);grade(Q.deck,id,ok)}
  Q.log.push(ansRow(Q.deck,cur.it,ok,cur.retry,modeTitle(Q.deck,Q.mode,Q.dir)));

/* one row for the Answers sheet (logAnswers, server v4.5): the word's real deck, also in "All of Unit n";
   again = the repeat of a word answered wrongly earlier in this practice */
function ansRow(d,it,ok,again,mode){const D=DECKS[d];if(D&&D.mix)return ansRow(it.d,it.it,ok,again,mode);
  return{deck:d,id:String(it.id),en:D&&D.type==="nb"?String(it.en||""):itemLabel(d,it),bg:String(it.bg||""),ok:!!ok,again:!!again,mode}}
function next(){Q.i++;if(!Q.queue[Q.i]){finish();return}render()}

/* Write the forms / Meaning (verbs): right only when every field is right; every variant counts, case does not; "Almost!" when
   exactly one field is one letter off and the others are right (a mistake, as elsewhere); an empty field is asked for, not graded;
   the wrong forms are marked in the answer */
function typedForms(){

  const rs=ins.map((el,i)=>checkTyped(el.value,q.fields[i].accept));
  const emp=rs.indexOf("empty");if(emp>=0){ins[emp].focus();return}
  const oks=rs.map(r=>r==="ok"||r==="hyphen");const ok=oks.every(Boolean);
  ins.forEach((el,i)=>{el.classList.add(oks[i]?"right":"wrong");el.readOnly=true});try{document.activeElement.blur()}catch(e){}
  document.querySelector("#tf button").disabled=true;
  const it=Q.queue[Q.i].it;const bad=new Set(q.fields.filter((f,i)=>!oks[i]).map(f=>f.key));

  q.answerHtml=f("inf",[it.inf])+" · "+f("past",it.past)+" · "+f("pp",it.pp);
  const nearI=rs.indexOf("near");const near=nearI>=0&&rs.filter(r=>r==="near").length===1&&oks.filter(Boolean).length===rs.length-1?q.fields[nearI].label.toLowerCase():"";
  answer(ok);

function corrFor(r){
  if(r.kind!=="nb"||r.manual||r.skipCorr)return null;
  if(r.status!=="fixed"&&r.status!=="choose")return null;
  const wrote=r.wen,wbg=r.wbg;
  /* en: the server (and fillCorrNums) find the number given to a row without one */
  if(r.both){const o=r.options;return{num:baseNum(r.num)||"",en:o[0].en.trim(),wrote:pairTxt(wrote,wbg),correct:o.map(x=>pairTxt(x.en,x.bg)).join("; "),note:r.note}}
  const enCh=lc(wrote)!==lc(r.en),bgCh=lc(wbg)!==lc(r.bg);
  if(!enCh&&!bgCh)return null;
  return{num:normNum(r.num)||"",en:r.en.trim(),wrote:bgCh?pairTxt(wrote,wbg||"(no translation)"):wrote,correct:bgCh?pairTxt(r.en,r.bg):r.en,note:r.note}}
function reloadNotebook(){return call("getNotebook").then(t2=>{let rws=[];try{rws=JSON.parse(t2||"[]")}catch(e){}
  if(rws.length){setNotebook(rws);try{localStorage.setItem("maya-nb-cache",JSON.stringify(rws))}catch(e){}}}).catch(()=>{})}
function doSave(){if(ADD.saving)return;
  const nb=ADD.src==="nb",tp=ADD.src==="tp";if(tp&&!topTitle())return;const uw=addWords();
  const rows=ADD.rows.filter(r=>rowState(r,uw).save);if(!rows.length)return;
  const sendRows=nb?ADD.rows.filter(r=>r.en.trim()&&!rowState(r,uw).fix):rows; /* never send a row whose number must be changed */
  ADD.saving=true;keep(render);
  const corrections=nb?rows.map(corrFor).filter(Boolean):[];
  const s=ADD.sec;const title=nb?"":tp?topTitle():(s.title||"").trim()||"Lesson "+s.lesson;
  const dups=nb?0:ADD.rows.filter(r=>rowState(r,uw).dup).length; /* not sent, so the server cannot count them */
  const noSave=()=>{ADD.saving=false;toast("Could not save. Check the connection and try again.");if(top_().name==="addReview")keep(render)};
  /* the answer can be lost after the server saved (timeout, network): savedAnyway reads the words again */
  const fail=()=>savedAnyway(ADD.src,rows,sendRows,corrections,title,dups).then(ok=>{if(!ok)noSave()},noSave);
  if(nb){
    const entries=sendRows.map(r=>({num:normNum(r.num)||null,en:r.en.trim(),bg:r.bg.trim()}));
    call("saveNotebookWords",JSON.stringify({entries,corrections})).then(txt=>{const res=JSON.parse(txt);
      if(res.error==="numbers"){ADD.saving=false;ADD.numErr={last:res.last,first:res.first};if(top_().name==="addReview")keep(render);return}
      const filled=fillCorrNums(corrections,res.added||[]);
      return reloadNotebook().then(()=>loadCorrections()).then(()=>{patchCorr(filled);ADD.saving=false;ADD.saved={kind:"nb",res,corrections,at:Date.now()};replace("addSaved")})}).catch(fail);
  }else if(tp){
    const words=rows.map(r=>({en:r.en.trim(),bg:r.bg.trim(),def:r.def||"",pos:r.pos||""}));const t=ADD.top;
    call("saveTopicWords",JSON.stringify({topicId:t.id,title,source:t.source,words})).then(txt=>{const res=JSON.parse(txt);
      return loadTextbook().then(()=>{ADD.saving=false;ADD.saved={kind:"tp",res,title:res.title||title,dups,at:Date.now()};replace("addSaved")})}).catch(fail);
  }else{
    const words=rows.map(r=>({en:r.en.trim(),bg:r.bg.trim(),def:r.def||"",pos:r.pos||""}));
    call("saveTextbookWords",JSON.stringify({unit:s.unit,lesson:s.lesson,title,words})).then(txt=>{const res=JSON.parse(txt);
      return loadTextbook().then(()=>{ADD.saving=false;ADD.saved={kind:"tb",res,title,dups,at:Date.now()};replace("addSaved")})}).catch(fail);
  }
}
/* DEF-26: a save whose answer was lost. When every word sent is in the notebook (textbook) now, it was saved: Saved,
   with Undo when the server names the batch of that save (lastBatch, Code.gs v4.3) and it holds exactly these words.
   Resolves false (the caller says "Could not save") when the words are not all there; rejects when the read fails. */
function lostBatch(src,ok){return call("lastBatch",src).then(t=>{const r=JSON.parse(t);return r&&r.batch&&r.items&&ok(r.items)?r:null}).catch(()=>null)}
function savedAnyway(src,rows,sendRows,corrections,title,dups){const nb=src==="nb";
  const show=(sv,b)=>{ADD.saving=false;ADD.saved=Object.assign(sv,{at:Date.now()-(b&&b.age||0),noUndo:!b});sv.res.batch=b?b.batch:"";replace("addSaved");return true};
  if(nb)return call("getNotebook").then(t=>{const rws=JSON.parse(t||"null");if(!Array.isArray(rws)||!rws.length)return false;
    setNotebook(rws);try{localStorage.setItem("maya-nb-cache",JSON.stringify(rws))}catch(e){}
    const found=rows.map(nbDup);if(found.some(x=>!x))return false;
    const added=[],ids=new Set();found.forEach((x,i)=>{if(!ids.has(x.id)){ids.add(x.id);added.push({num:x.id,en:rows[i].en.trim()})}});
    const skipped=sendRows.filter(r=>!rows.includes(r)).map(r=>({num:normNum(r.num),en:r.en.trim(),reason:"already in the notebook"}));
    for(let k=added.length;k<rows.length;k++)skipped.push({reason:"already in the notebook"}); /* the same word twice on the page */
    return lostBatch("Notebook",it=>Array.isArray(it.notebook)&&it.notebook.length===ids.size&&it.notebook.every(n=>ids.has(String(n)))).then(b=>{
      const filled=fillCorrNums(corrections,added);
      return loadCorrections().then(()=>{patchCorr(filled);return show({kind:"nb",res:{added,skipped,renumbered:[]},corrections},b)})})});
  const s=ADD.sec;
  return call("getTextbook").then(t=>{const tb=JSON.parse(t||"null");if(!setTextbook(tb))return false;
    try{localStorage.setItem("maya-tb-cache",t)}catch(e){}

      const tpc=(ADD.top.id&&topicOf(ADD.top.id))||topicByTitle(title);if(!tpc)return false;
      const tw=topicWords(tpc.id);const m=new Map();rows.forEach(r=>{const en=r.en.trim();if(!m.has(lc(en)))m.set(lc(en),en)});
      if([...m.keys()].some(k=>!tw.has(k)))return false;
      const added=[...m.values()];const skipped=rows.slice(added.length).map(r=>r.en.trim());
      return lostBatch("Topic",it=>{const x=it.topic;return !!x&&String(x.id)===tpc.id&&Array.isArray(x.ids)&&
        x.ids.length===m.size&&x.ids.every(id=>m.has(lc(String(id).replace(/ \(\d+\)$/,""))))})
        .then(b=>show({kind:"tp",res:{topic:tpc.id,title:tpc.title,deck:b?b.items.topic.deck:tpc.sets[0],added,skipped},title:tpc.title,dups},b))}
    const uw=unitWords(s.unit);const m=new Map();rows.forEach(r=>{const en=r.en.trim();if(!m.has(lc(en)))m.set(lc(en),en)});
    if([...m.keys()].some(k=>!uw.has(k)))return false;
    const added=[...m.values()];const skipped=rows.slice(added.length).map(r=>r.en.trim());
    return lostBatch("Textbook",it=>{const x=it.textbook;return !!x&&String(x.unit)===String(s.unit)&&x.deck==="L"+s.lesson&&Array.isArray(x.ids)&&
      x.ids.length===m.size&&x.ids.every(id=>m.has(lc(String(id).replace(/ \(\d+\)$/,""))))})
      .then(b=>show({kind:"tb",res:{unit:s.unit,deck:"L"+s.lesson,added,skipped},title,dups},b))})}
SCREENS.addSaved=()=>{const sv=ADD.saved;const res=sv.res;const n=res.added.length;const nb=sv.kind==="nb",tp=sv.kind==="tp";
  const nums=nb?res.added.map(a=>a.num).sort((a,b)=>a.localeCompare(b,"en",{numeric:true})):[];
  const where=nb?(n?"Notebook #"+nums[0]+(n>1?" to #"+nums[nums.length-1]:""):"Notebook"):tp?"Topics · "+sv.title:"Unit "+res.unit+" · "+(ADD.sec.lesson)+" · "+sv.title;
  /* the server says why a notebook word was skipped: "already in the notebook", or its number is used by another word */
  const sk=nb?res.skipped.filter(x=>!x||!x.reason||x.reason==="already in the notebook").length:(sv.dups||0)+res.skipped.length;
  const other=nb?res.skipped.length-sk:0;const inWhere=nb?"your notebook":tp?sv.title:"Unit "+res.unit;
  const canUndo=n&&res.batch&&!sv.undone&&Date.now()-sv.at<UNDO_MS;
  return{html:`<div class="wrap" style="padding-top:calc(24px + env(safe-area-inset-top,0px))">
    <div style="text-align:center;display:flex;flex-direction:column;gap:6px"><div class="done-mark">${icon("check")}</div>
    <h1 style="font-size:1.7rem">${n?plural(n,"word")+" added":"No new words"}</h1>
    <p class="muted">${esc(where)}</p>
    ${sk&&n?`<p id="skipline">${sk} ${sk===1?"was":"were"} already in ${esc(inWhere)}, so ${sk===1?"it was":"they were"} not added again.</p>`:""}
    ${other?`<p id="otherline">${plural(other,"word")} could not be added because ${other===1?"its number is":"their numbers are"} already used.</p>`:""}
    <p class="hint">${n?"They are saved online, on all your devices.":other?"Fix the numbers and save the page again.":"All the words from this page are already in the app."}</p></div>
    ${canUndo?`<div class="undo"><button class="btn ghost" id="undo">${icon("redo")} Undo</button><span class="hint">You can undo this for 10 minutes.</span></div>`:""}
    ${n&&sv.noUndo?`<p class="hint" id="noundo">Undo is not available for this save.</p>`:""}
    ${sv.late?`<p class="hint" id="late">It's too late to undo here. Ask Dad to remove these words.</p>`:""}
    ${nb&&sv.corrections.length?`<section class="field-row"><span class="label">Fix these in your notebook</span><div class="list">${sv.corrections.map(c=>`<div class="rowlink"><div class="fixcard">
      <span class="nr">${c.num?"#"+esc(c.num):"No number"}</span><span>You wrote: <s>${esc(c.wrote)}</s></span><span class="ok">Correct: ${esc(c.correct)}</span>${c.note?`<span class="note-line">${esc(c.note)}</span>`:""}</div></div>`).join("")}</div>
      <p class="hint">You can find this list later on Home, under your notebook.</p></section>`:""}
  </div>`,
  dock:`<div class="row"><button class="btn ghost" id="hm">${icon("home")} Home</button><button class="btn primary" id="pr" ${n?"":"disabled"}>${icon("play")} Practise</button></div>`,
  after(){$("#hm").onclick=goHome;
    const un=$("#undo");if(un)un.onclick=()=>{
      if(Date.now()-sv.at>=UNDO_MS){sv.late=true;keep(render);return}
      openSheet(`<div class="sheet-head"><div class="txt"><h2>Undo ${n===1?"this word":"these "+n+" words"}?</h2><p>${n===1?"It":"They"} will be removed from ${nb?"your notebook":tp?esc(sv.title):esc("Unit "+res.unit+" · "+ADD.sec.lesson)}.</p></div></div>
        <div style="display:flex;gap:8px"><button class="btn ghost" id="uy" style="flex:1">Undo</button><button class="btn primary" id="un" style="flex:1">Keep them</button></div>`,
        sh=>{sh.querySelector("#un").onclick=()=>closeSheet();
          sh.querySelector("#uy").onclick=()=>{const b=sh.querySelector("#uy");b.disabled=true;b.textContent="Removing...";
            call("undoBatch",res.batch).then(txt=>{let r={};try{r=JSON.parse(txt)}catch(e){}
              if(r.error==="too_late"){closeSheet(true);sv.late=true;keep(render);return}
              /* not_found: already removed elsewhere; reload the words like a successful undo */
              return (nb?reloadNotebook().then(()=>loadCorrections()):loadTextbook())
                .then(()=>{closeSheet(true);sv.undone=true;toast(r.error==="not_found"?"Already removed.":"Removed.");goHome()})})
            .catch(()=>{closeSheet(true);toast("Could not undo. Check the connection and try again.")})}})};
    const pr=$("#pr");if(pr)pr.onclick=()=>{
      if(nb){const ids=new Set(nums);const items=DECKS.nb.items.filter(x=>ids.has(x.id));if(!items.length){goHome();return}
        const p=Object.assign({},S.pref,{deck:"nb",mode:"flash",dir:"en",n:"all",nbLast:0,nbFrom:items[0].num,nbTo:items[items.length-1].num});
        TAB="home";NAV.stack=[{name:"home",params:{root:true}}];startQuiz(p,false,items)}
      else{const d=res.deck;goHome();if(DECKS[d]){if(!DECKS[d].topic){OPEN_UNIT=DECKS[d].unit;keep(render)}openDeckSheet(d)}}}}}};
SCREENS.addSaved.label="Home";

/* ---------- start ---------- */
/* without a server (the page opened without the personal link) only a short note is shown */
function noLink(){document.body.dataset.screen="nolink";
  $("#app").innerHTML=`<div class="wrap" style="padding-top:calc(56px + env(safe-area-inset-top,0px));text-align:center;align-items:center">
    <div class="done-mark" style="background:var(--accent-soft);color:var(--accent);margin:0">${icon("note")}</div>
    <h1 style="font-size:1.7rem">Word Trainer</h1><p class="muted">Open the app from your personal link.</p></div>`}
if(GAS){TAB="home";resetTo("home",{root:true});pull()}
else noLink();
</script>
